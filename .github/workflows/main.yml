name: CI
on: 
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    
jobs:
  parallel-demo:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.2.10
      - run: mise run setup
      - name: Test
        id: tests
        background: true  
        run: mise run test
      - name: Lint
        run: mise run lint
      - name: Wait for tests
        wait: tests
      - name: Wait for remaining work
        wait-all:



