name: CI
on: 
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.2.10
      - run: mise run setup
      - run: mise run lint

  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.2.10
      - run: mise run setup    
      - run: mise run test

  verify:
    name: CI result
    needs: [lint, test]
    runs-on: ubuntu-26.04
    steps:
      - run: echo "All checks passed"

  access-demo:
    runs-on: ubuntu-26.04
    steps:
      - name: Read repository information
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api "repos/$GITHUB_REPOSITORY" --jq .full_name

      - name: Show pull request title
        if: ${{ github.event_name == 'pull_request' }}
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE"

      - name: Check training secret
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          TRAINING_SECRET: ${{ secrets.TRAINING_SECRET }}
        run: |
          test -n "$TRAINING_SECRET"
          echo 'Training secret is available'