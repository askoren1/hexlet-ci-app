name: CI
on:
  push:
    branches: [main, ci-expressions]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CHECK_LABEL: training
    
jobs:
  lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.2.10
      - run: mise run setup
      - run: mise run lint

  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.2.10
      - run: mise run setup   
      - name: Workflow values
        run: |
          echo "CHECK_LABEL=$CHECK_LABEL"
          echo "GITHUB_WORKFLOW=$GITHUB_WORKFLOW"
          echo "event=$GITHUB_EVENT_NAME"

      - name: Step value
        env:
          CHECK_LABEL: local-step
        run: echo "CHECK_LABEL=$CHECK_LABEL"

      - name: Workflow value again
        run: echo "CHECK_LABEL=$CHECK_LABEL"

      - name: Repository value
        env:
          CI_LABEL: ${{ vars.CI_LABEL || 'training' }}
        run: echo "CI_LABEL=$CI_LABEL"

      - name: Manual only
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: echo "Started manually"

      - name: Run tests
        run: mise run test

      - name: Explain failure
        if: ${{ failure() }}
        run: echo 'Open the first failed step in this job.'

  verify:
    name: CI result
    needs: [lint, test]
    runs-on: ubuntu-26.04
    steps:
      - run: echo "All checks passed"


